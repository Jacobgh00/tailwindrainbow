name: Release

run-name: >-
  ${{ inputs.publish && 'Publish' || 'Sign and verify' }}
  ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to JetBrains Marketplace"
        type: boolean
        required: true
        default: false
      wide_verification:
        description: "Verify against every supported IDE, not only IntelliJ IDEA Community"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: jetbrains-marketplace-release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.publish && 'Publish' || 'Sign and verify' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: jetbrains-marketplace

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      # Restoring cached IntelliJ distributions and transformed dependencies
      # exceeds the disk capacity of a standard GitHub-hosted runner.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true

      - name: Validate release
        id: metadata
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          plugin_version="$(
            ./gradlew properties \
              --property version \
              --quiet \
              --no-build-cache \
              --console=plain |
              sed -n 's/^version: //p'
          )"

          if [[ -z "$plugin_version" ]]; then
            echo "Could not determine the plugin version."
            exit 1
          fi

          echo "version=$plugin_version" >> "$GITHUB_OUTPUT"

          if [[ "$PUBLISH_REQUESTED" != "true" ]]; then
            exit 0
          fi

          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "Publishing requires a Git tag."
            exit 1
          fi

          if [[ "$REF_NAME" != "v$plugin_version" ]]; then
            echo "Tag '$REF_NAME' does not match plugin version 'v$plugin_version'."
            exit 1
          fi

      - name: Lint
        id: lint
        run: >-
          ./gradlew
          ktlintCheck
          detekt
          --no-build-cache
          --console=plain

      # Four IDE distributions do not fit alongside the runner's preinstalled
      # toolchains.
      - name: Free disk space
        if: ${{ inputs.wide_verification }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      # Re-run the complete quality gate for the exact release ref.
      - name: Verify
        id: verify
        env:
          VERIFICATION_TARGET: ${{ inputs.wide_verification && 'wide' || 'baseline' }}
        run: >-
          ./gradlew
          ktlintCheck
          detekt
          --no-build-cache
          --console=plain

      - name: Test
        id: test
        run: >-
          ./gradlew
          test
          --no-build-cache
          --console=plain

      - name: Verify plugin
        id: verify
        run: >-
          ./gradlew
          verifyPlugin
          "-PpluginVerificationTarget=$VERIFICATION_TARGET"
          --no-build-cache
          --console=plain

      - name: Upload verification failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-reports
          path: |
            build/reports/tests/**
            build/test-results/**
            build/reports/detekt/**
            build/reports/ktlint/**
            build/reports/pluginVerifier/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Sign and verify signature
        id: sign
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: >-
          ./gradlew
          signPlugin
          verifyPluginSignature
          --no-build-cache
          --console=plain

      - name: Publish to JetBrains Marketplace
        id: publish
        if: ${{ inputs.publish }}
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: >-
          ./gradlew
          publishPlugin
          --no-build-cache
          --console=plain

      # Preserve the signed archive if Marketplace publishing fails.
      - name: Upload signed plugin
        id: artifact
        if: ${{ !cancelled() && steps.sign.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-plugin-${{ steps.metadata.outputs.version }}
          path: build/distributions/*-signed.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
          PLUGIN_VERSION: ${{ steps.metadata.outputs.version }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          if [[ "$METADATA_OUTCOME" != "success" ]]; then
            status="Release validation failed"
          elif [[ "$LINT_OUTCOME" != "success" ]]; then
            status="Linting failed"
          elif [[ "$TEST_OUTCOME" != "success" ]]; then
            status="Tests failed"
          elif [[ "$VERIFY_OUTCOME" != "success" ]]; then
            status="Plugin verification failed"
          elif [[ "$SIGN_OUTCOME" != "success" ]]; then
            status="Signing failed"
          elif [[ "$PUBLISH_REQUESTED" == "true" && "$PUBLISH_OUTCOME" != "success" ]]; then
            status="Publishing failed"
          elif [[ "$ARTIFACT_OUTCOME" != "success" ]]; then
            status="Signed successfully, but artifact upload failed"
          elif [[ "$PUBLISH_REQUESTED" == "true" ]]; then
            status="Published"
          else
            status="Signed and verified — nothing uploaded"
          fi

          {
            echo "### $status"
            echo
            echo "- ref: \`$REF_NAME\`"
            echo "- version: \`${PLUGIN_VERSION:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"