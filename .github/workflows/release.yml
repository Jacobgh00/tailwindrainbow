name: Release

# Publishing is never automatic. There is no push, tag, or release trigger: the only way a
# version reaches JetBrains Marketplace is a human running this from the Actions tab.
#
# The `publish` input defaults to false, so a run started by accident signs the plugin and
# stops. That doubles as the way to prove the signing secrets are correct without uploading
# anything — worth doing before the first real release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to JetBrains Marketplace (leave unchecked to sign only)"
        type: boolean
        default: false

jobs:
  release:
    name: ${{ inputs.publish && 'Publish' || 'Sign only (dry run)' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Re-run the whole gate rather than trusting the commit was green: a release may be
      # cut from a ref that never went through a pull request.
      - name: Verify
        run: ./gradlew ktlintCheck detekt test verifyPlugin

      # Runs on every dispatch, publish or not. A malformed certificate or a passphrase that
      # does not match the key fails here, where it costs nothing.
      - name: Sign
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin verifyPluginSignature

      - name: Publish to JetBrains Marketplace
        if: ${{ inputs.publish }}
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-plugin
          path: build/distributions/*.zip

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ inputs.publish && 'Published' || 'Signed only — nothing uploaded' }}"
            echo ""
            echo "- ref: \`${{ github.ref_name }}\`"
            echo "- version: \`$(./gradlew properties --property version -q --console=plain | grep '^version:' | cut -d' ' -f2)\`"
          } >> "$GITHUB_STEP_SUMMARY"
