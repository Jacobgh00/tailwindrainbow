name: Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Static analysis first: it is the fastest signal, so a style failure does not
      # wait behind a platform download.
      - name: Lint
        run: ./gradlew ktlintCheck detekt

      - name: Test
        run: ./gradlew test

      # Structural validation of the artifact itself — this is what caught an invalid
      # plugin ID before it could ever be published under it.
      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Build plugin
        run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            build/reports/tests/**
            build/reports/detekt/**
            build/reports/ktlint/**
