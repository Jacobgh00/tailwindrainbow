name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      # Restoring cached IntelliJ distributions and transformed dependencies
      # exceeds the disk capacity of a standard GitHub-hosted runner.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true

      - name: Lint
        run: >-
          ./gradlew
          ktlintCheck
          detekt
          --no-build-cache
          --console=plain

      - name: Test
        run: >-
          ./gradlew
          test
          --no-build-cache
          --console=plain

      - name: Verify plugin
        run: >-
          ./gradlew
          verifyPlugin
          -PpluginVerificationTarget=baseline
          --no-build-cache
          --console=plain

      - name: Upload plugin distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports
          path: |
            build/reports/tests/**
            build/test-results/**
            build/reports/detekt/**
            build/reports/ktlint/**
            build/reports/pluginVerifier/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7