name: Wide verification

run-name: Verify ${{ github.ref_name }} against every supported IDE

# The plugin declares only com.intellij.modules.platform, so it loads in every
# JetBrains IDE. This job verifies it against the ones whose users write
# Tailwind. Each IDE is a separate download of about a gigabyte, which is why it
# is not part of the build that runs on every pull request.
on:
  workflow_dispatch:
  schedule:
    # Mondays at 06:00 UTC, so a platform change lands here before a release does.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify against every supported IDE
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      # IntelliJ distributions make the Gradle dependency and transform caches
      # too large for a standard GitHub runner when restored and extracted.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true

      # Four IDE distributions do not fit alongside the runner's preinstalled
      # toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Verify
        run: >-
          ./gradlew
          verifyPlugin
          -PpluginVerificationTarget=wide
          --no-build-cache
          --console=plain

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wide-verification-reports
          path: |
            build/reports/pluginVerifier/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 14
